<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6b33"/>
    </marker>
  </defs>
  <rect width="1240" height="860" fill="#ffffff"/>

  <text x="620" y="48" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="7" fill="#14100b">THE TECHNOLOGY FLOW</text>
  <text x="620" y="70" text-anchor="middle" font-size="11.5" letter-spacing="2" fill="#5c5344">AI AGENTS AND APIS ARE THE TOOLS · GIT IS THE TRUTH · THE GATE DECIDES WHAT SHIPS</text>
  <line x1="40" y1="86" x2="1200" y2="86" stroke="#14100b" stroke-width="2"/>

  <!-- band 1: tools -->
  <text x="40" y="112" font-size="11" font-weight="700" letter-spacing="3" fill="#8a6b33">TOOLS</text>
  <g font-size="11.5">
    <rect x="40" y="122" width="560" height="64" fill="#ffffff" stroke="#d9d2c2"/>
    <text x="320" y="146" text-anchor="middle" font-weight="700" letter-spacing="1" fill="#14100b">AI AGENTS · CLAUDE CODE AND CODEX</text>
    <text x="320" y="165" text-anchor="middle" fill="#5c5344" font-size="10.5">run the eight worker assignments · one implements, one reviews</text>

    <rect x="640" y="122" width="560" height="64" fill="#ffffff" stroke="#d9d2c2"/>
    <text x="920" y="146" text-anchor="middle" font-weight="700" letter-spacing="1" fill="#14100b">API CONNECTORS · THE CAPTURE TOOLS</text>
    <text x="920" y="165" text-anchor="middle" fill="#5c5344" font-size="10.5">Search Console · Analytics · DataForSEO · PageSpeed · Trends · embeddings · citations</text>
  </g>
  <line x1="320" y1="186" x2="320" y2="218" stroke="#8a6b33" marker-end="url(#ta)"/>
  <line x1="920" y1="186" x2="920" y2="218" stroke="#8a6b33" marker-end="url(#ta)"/>

  <!-- band 2: github -->
  <text x="40" y="214" font-size="11" font-weight="700" letter-spacing="3" fill="#8a6b33">THE TRUTH</text>
  <rect x="40" y="222" width="1160" height="86" fill="#f4f1ea" stroke="#d9d2c2"/>
  <text x="620" y="247" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#14100b">GITHUB REPOSITORY</text>
  <g font-size="10.5" fill="#5c5344">
    <text x="160" y="270" text-anchor="middle" font-family="Courier New, monospace">data/ facts</text>
    <text x="360" y="270" text-anchor="middle" font-family="Courier New, monospace">templates/ pages</text>
    <text x="580" y="270" text-anchor="middle" font-family="Courier New, monospace">schema/ JSON-LD</text>
    <text x="800" y="270" text-anchor="middle" font-family="Courier New, monospace">scripts/ pipeline</text>
    <text x="1030" y="270" text-anchor="middle" font-family="Courier New, monospace">data/performance/ baselines</text>
  </g>
  <text x="620" y="294" text-anchor="middle" font-size="10.5" fill="#5c5344">branch per change · adversarial review on every pull request · full history, one command rollback</text>

  <line x1="620" y1="308" x2="620" y2="340" stroke="#8a6b33" marker-end="url(#ta)"/>

  <!-- band 3: gate -->
  <text x="40" y="336" font-size="11" font-weight="700" letter-spacing="3" fill="#8a6b33">THE GATE</text>
  <rect x="40" y="344" width="1160" height="58" fill="#ffffff" stroke="#9c3b22" stroke-width="1.5"/>
  <text x="620" y="368" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#9c3b22">CI · SEO VALIDATE ON EVERY PULL REQUEST</text>
  <text x="620" y="387" text-anchor="middle" font-size="10.5" fill="#5c5344">27 failure classes checked · a mistake that was fixed once can never merge again · humans approve facts and brand claims</text>

  <line x1="320" y1="402" x2="320" y2="434" stroke="#8a6b33" marker-end="url(#ta)"/>
  <line x1="920" y1="402" x2="920" y2="434" stroke="#8a6b33" marker-end="url(#ta)"/>

  <!-- band 4: operate + deploy -->
  <text x="40" y="430" font-size="11" font-weight="700" letter-spacing="3" fill="#8a6b33">OPERATE AND DEPLOY</text>
  <g font-size="11.5">
    <rect x="40" y="438" width="560" height="64" fill="#ffffff" stroke="#d9d2c2"/>
    <text x="320" y="462" text-anchor="middle" font-weight="700" letter-spacing="1" fill="#14100b">THE CONSOLE · LOCAL NODE APP</text>
    <text x="320" y="481" text-anchor="middle" fill="#5c5344" font-size="10.5">zero dependencies · eight screens · reads and writes the repository</text>

    <rect x="640" y="438" width="560" height="64" fill="#14100b"/>
    <text x="920" y="462" text-anchor="middle" font-weight="700" letter-spacing="1" fill="#ffffff">DUDA REST API</text>
    <text x="920" y="481" text-anchor="middle" fill="#d9d2c2" font-size="10.5">diff, then draft, then publish · rollback is a git revert</text>
  </g>
  <line x1="600" y1="470" x2="636" y2="470" stroke="#8a6b33" marker-end="url(#ta)"/>
  <line x1="920" y1="502" x2="920" y2="534" stroke="#8a6b33" marker-end="url(#ta)"/>

  <!-- band 5: live -->
  <rect x="40" y="538" width="1160" height="58" fill="#f4f1ea" stroke="#d9d2c2"/>
  <text x="620" y="562" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="3" fill="#14100b">WOLFFCONSTRUCTION.COM · LIVE</text>
  <text x="620" y="581" text-anchor="middle" font-size="10.5" fill="#5c5344">every publish announces itself: IndexNow to the Bing family and AI engines · sitemap to Google</text>

  <line x1="620" y1="596" x2="620" y2="628" stroke="#8a6b33" marker-end="url(#ta)"/>

  <!-- band 6: measure -->
  <text x="40" y="624" font-size="11" font-weight="700" letter-spacing="3" fill="#8a6b33">RE CAPTURE</text>
  <rect x="40" y="632" width="1160" height="58" fill="#ffffff" stroke="#66794b" stroke-width="1.5"/>
  <text x="620" y="656" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#14100b">THE CONNECTORS RUN AGAIN · DAY 1 VERSUS TODAY ON EVERY NUMBER</text>
  <text x="620" y="675" text-anchor="middle" font-size="10.5" fill="#5c5344">positions, failures, citations, speed, enquiries with budget · written back into the repository as new baselines</text>

  <polyline points="1200,661 1226,661 1226,250 1204,250" fill="none" stroke="#8a6b33" stroke-width="1.5" marker-end="url(#ta)"/>
  <text x="1222" y="470" font-size="10.5" font-weight="700" letter-spacing="3" fill="#8a6b33" transform="rotate(-90 1222 470)">NEW DATA COMMITS BACK TO GIT</text>

  <!-- footer -->
  <line x1="40" y1="726" x2="1200" y2="726" stroke="#d9d2c2"/>
  <text x="620" y="754" text-anchor="middle" font-size="11" letter-spacing="2" fill="#5c5344">EVERYTHING IS A FILE IN GIT · EVERYTHING IS REVIEWED BEFORE IT SHIPS · EVERYTHING IS MEASURED AFTER</text>
  <text x="620" y="778" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#8a6b33">CLONE THE REPOSITORY, SWAP THE DATA FILES, AND THE SAME MACHINE RUNS THE NEXT CONTRACTOR SITE</text>
</svg>
